version: '3.8'

services:
  octoprint-snapshot-proxy:
    image: python:3.12-slim
    container_name: octoprint-snapshots-lite-esp32-bymiuc
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python app.py"
    ports:
      - "30113:30113"
    environment:
      PORT: "30113"
      OCTOPRINT_SNAPSHOT_URL: "http://<OCTOPRINT_IP>:<OCTOPRINT_PORT>/webcam/?action=snapshot"
      DEFAULT_WIDTH: "480"
      DEFAULT_HEIGHT: "270"
      JPEG_QUALITY: "75"
      CACHE_MS: "500"
      REQUEST_TIMEOUT: "5"
    volumes:
      - /octoprint-snapshot-ESP32-ByMiuC/app:/app:ro
    restart: unless-stopped